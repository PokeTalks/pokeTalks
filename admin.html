
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PokeTalks Admin Login</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #080d18;
      color: #f4f7ff;
      font-family: Arial, sans-serif;
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      padding: 28px;
      background: #121b2b;
      border: 1px solid #263c55;
      border-radius: 18px;
      box-shadow: 0 15px 50px #0006;
    }

    h1 { color: #35d9ed; margin-top: 0; }
    p { color: #aab8ca; line-height: 1.5; }

    label {
      display: block;
      margin: 16px 0 7px;
    }

    input {
      width: 100%;
      padding: 12px;
      color: white;
      background: #0a1220;
      border: 1px solid #35465e;
      border-radius: 9px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      border: 0;
      border-radius: 9px;
      background: #23c8df;
      color: #07111d;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    #message {
      overflow-wrap: anywhere;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <main class="login-card">
    <h1>PokeTalks Admin</h1>
    <p>Sign in with your authorized administrator account.</p>

    <form id="loginForm">
      <label for="email">Email address</label>
      <input id="email" type="email"
             autocomplete="username" required>

      <label for="password">Password</label>
      <input id="password" type="password"
             autocomplete="current-password" required>

      <button type="submit">Log in</button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>
    <a href="./index.html" style="color:#35d9ed">Back to website</a>
    <div id="loginPanel">
  <!-- Existing login form isi panel mein rakho -->
</div>

<section id="dashboard" hidden>
  <h2>Admin Dashboard</h2>
  <p id="adminStatus" role="status"></p>

  <button id="logoutButton" type="button">
    Log out
  </button>

  <h3>Manage Pokémon</h3>
  <form id="pokemonForm">
    <input id="pokemonName" placeholder="Pokémon name" required>
    <input id="pokemonType" placeholder="Pokémon type">
    <textarea id="pokemonDescription"
      placeholder="Description" required></textarea>
    <input id="pokemonImage" type="file"
      accept="image/jpeg,image/png,image/webp" required>
    <label>
      <input id="pokemonPublished" type="checkbox">
      Publish Pokémon
    </label>
    <button type="submit">Save Pokémon</button>
  </form>

  <div id="pokemonList"></div>

  <h3>Manage Videos</h3>
  <form id="videoForm">
    <input id="videoTitle" placeholder="Video title" required>
    <textarea id="videoDescription"
      placeholder="Description"></textarea>
    <input id="videoImage" type="file"
      accept="image/jpeg,image/png,image/webp" required>
    <input id="videoLink" type="url"
      placeholder="Linkvertise URL (optional)">
    <label>
      <input id="videoPublished" type="checkbox">
      Publish video
    </label>
    <button type="submit">Save video</button>
  </form>

  <div id="videoList"></div>
</section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./admin.js"></script>
</body>
</html>
