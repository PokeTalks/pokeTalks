
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PokeTalks Admin Login</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #080d18;
      color: #f4f7ff;
      font-family: Arial, sans-serif;
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      padding: 28px;
      background: #121b2b;
      border: 1px solid #263c55;
      border-radius: 18px;
      box-shadow: 0 15px 50px #0006;
    }

    h1 { color: #35d9ed; margin-top: 0; }
    p { color: #aab8ca; line-height: 1.5; }

    label {
      display: block;
      margin: 16px 0 7px;
    }

    input {
      width: 100%;
      padding: 12px;
      color: white;
      background: #0a1220;
      border: 1px solid #35465e;
      border-radius: 9px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      border: 0;
      border-radius: 9px;
      background: #23c8df;
      color: #07111d;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    #message {
      overflow-wrap: anywhere;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <main class="login-card">
    <h1>PokeTalks Admin</h1>
    <p>Sign in with your authorized administrator account.</p>

    <form id="loginForm">
      <label for="email">Email address</label>
      <input id="email" type="email"
             autocomplete="username" required>

      <label for="password">Password</label>
      <input id="password" type="password"
             autocomplete="current-password" required>

      <button type="submit">Log in</button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>
    <a href="./index.html" style="color:#35d9ed">Back to website</a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./admin.js"></script>
</body>
</html>
