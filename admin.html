```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d18">
  <title>PokeTalks Admin Panel</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      min-height: 100vh;
      background: #080d18;
      color: #f4f7ff;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 850px;
      margin: 30px auto;
    }

    .panel {
      padding: 24px;
      margin-bottom: 24px;
      background: #121b2b;
      border: 1px solid #263c55;
      border-radius: 16px;
    }

    h1, h2 { color: #35d9ed; }

    label {
      display: block;
      margin: 14px 0;
    }

    input, textarea {
      display: block;
      width: 100%;
      margin-top: 7px;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #35465e;
      background: #0a1220;
      color: white;
    }

    input[type="checkbox"] {
      display: inline;
      width: auto;
    }

    button {
      padding: 12px 18px;
      margin: 8px 5px 8px 0;
      border: 0;
      border-radius: 8px;
      background: #23c8df;
      color: #07111d;
      font-weight: bold;
      cursor: pointer;
    }

    .danger { background: #ff647c; }

    a { color: #35d9ed; }

    [hidden] { display: none !important; }

    #message, #adminStatus {
      overflow-wrap: anywhere;
      line-height: 1.6;
    }

    article {
      padding: 16px;
      margin: 12px 0;
      border: 1px solid #35465e;
      border-radius: 10px;
    }
  </style>
</head>

<body>
  <main class="container">
    <a href="./index.html">← Back to PokeTalks</a>

    <!-- LOGIN PANEL -->
    <section id="loginPanel" class="panel">
      <h1>PokeTalks Admin</h1>
      <p>Sign in with your authorized administrator account.</p>

      <form id="loginForm">
        <label for="email">Email address</label>
        <input id="email" type="email"
               autocomplete="username" required>

        <label for="password">Password</label>
        <input id="password" type="password"
               autocomplete="current-password" required>

        <button id="loginButton" type="submit">Log in</button>
      </form>

      <p id="message" role="status" aria-live="polite"></p>
    </section>

    <!-- DASHBOARD: hidden until admin verification succeeds -->
    <section id="dashboard" class="panel" hidden>
      <h1>Admin Dashboard</h1>
      <p id="adminStatus" role="status" aria-live="polite"></p>

      <button id="logoutButton" type="button" class="danger">
        Log out
      </button>

      <hr>

      <h2>Add Pokémon</h2>
      <form id="pokemonForm">
        <label>Pokémon name
          <input id="pokemonName" required>
        </label>

        <label>Pokémon type
          <input id="pokemonType">
        </label>

        <label>Description
          <textarea id="pokemonDescription" required></textarea>
        </label>

        <label>Pokémon image
          <input id="pokemonImage"
                 type="file"
                 accept="image/jpeg,image/png,image/webp"
                 required>
        </label>

        <label>
          <input id="pokemonPublished" type="checkbox">
          Publish Pokémon
        </label>

        <button type="submit">Save Pokémon</button>
      </form>

      <h2>Manage Pokémon</h2>
      <div id="pokemonList"></div>

      <hr>

      <h2>Add Video</h2>
      <form id="videoForm">
        <label>Video title
          <input id="videoTitle" required>
        </label>

        <label>Description
          <textarea id="videoDescription"></textarea>
        </label>

        <label>Thumbnail
          <input id="videoImage"
                 type="file"
                 accept="image/jpeg,image/png,image/webp"
                 required>
        </label>

        <label>Linkvertise URL (optional)
          <input id="videoLink"
                 type="url"
                 placeholder="https://linkvertise.com/...">
        </label>

        <label>
          <input id="videoPublished" type="checkbox">
          Publish video
        </label>

        <button type="submit">Save Video</button>
      </form>

      <h2>Manage Videos</h2>
      <div id="videoList"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./admin.js"></script>
</body>
</html>
```
